# Fiadito Platform (API REST)
spring.application.name=fiadito-platform
server.port=8080

# Variables locales (DB_PASSWORD, JWT_SECRET...) en un archivo .env en la raíz del proyecto (no se sube a Git)
spring.config.import=optional:file:.env[.properties]

# MySQL 8 local: base de datos "fiadito" (se crea sola si no existe)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:fiadito}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate: crea y actualiza las tablas a partir de las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JSON: fechas como texto (2026-10-15) y zona horaria de Lima
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=America/Lima
spring.jackson.default-property-inclusion=always

# CORS: solo el frontend (Vite)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# JWT: clave secreta (mínimo 32 caracteres) y vigencia de 8 horas
app.jwt.secret=${JWT_SECRET:fiadito-clave-de-desarrollo-cambiala-en-produccion-2026}
app.jwt.expiration=${JWT_EXPIRATION_MS:28800000}

# Zona horaria y fecha simulada opcional (YYYY-MM-DD) para ensayar los casos de prueba
app.zone=America/Lima
app.system-date=${SYSTEM_DATE:}

# Datos iniciales (Fuerza Norte Gym, productos de la Tabla 4 y juegos de prueba) si la base está vacía
app.seed.enabled=${SEED_ENABLED:true}

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
